x-app: &app
  build: .
  environment: &env
    AUTH_SECRET: dev-only-secret-change-me
    DATABASE_URL: postgres://chat:chat@postgres:5432/chat
    CASSANDRA_CONTACT_POINTS: cassandra
    REDIS_URL: redis://redis:6379
    KAFKA_BROKERS: kafka:9092
    S3_ENDPOINT: http://s3:9090
    S3_PUBLIC_ENDPOINT: http://localhost:${S3_HOST_PORT:-9090} # presigned URLs used from the host
    MESSAGING_URL: http://messaging:3001
    BUCKET_SIZE: "50" # demo: tiny Cassandra buckets so paging crosses partitions (prod: ~1000+)
  depends_on:
    init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  # ---------- infrastructure ----------
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: chat, POSTGRES_PASSWORD: chat, POSTGRES_DB: chat }
    ports: ["${PG_HOST_PORT:-5432}:5432"]
    restart: unless-stopped

  cassandra:
    image: cassandra:4.1
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    restart: unless-stopped

  s3:
    image: adobe/s3mock:3.12.0 # local S3 stand-in; Amazon S3 + CloudFront in production
    ports: ["${S3_HOST_PORT:-9090}:9090"]
    restart: unless-stopped

  init:
    <<: *app
    command: ["node", "scripts/init.js"]
    depends_on:
      postgres: { condition: service_started }
      kafka: { condition: service_started }
      s3: { condition: service_started }
      cassandra: { condition: service_healthy }
    restart: "no"

  # ---------- application ----------
  messaging:
    <<: *app
    command: ["node", "src/messaging-service/server.js"]
    ports: ["${MESSAGING_HOST_PORT:-3001}:3001"]

  # Two gateways on separate ports to show cross-gateway routing (an ALB/NLB in production).
  gateway-1:
    <<: *app
    command: ["node", "src/gateway/server.js"]
    environment: { <<: *env, GATEWAY_ID: gw-1 }
    ports: ["${GW1_HOST_PORT:-8081}:8081"]

  gateway-2:
    <<: *app
    command: ["node", "src/gateway/server.js"]
    environment: { <<: *env, GATEWAY_ID: gw-2 }
    ports: ["${GW2_HOST_PORT:-8082}:8081"]

  outbox-publisher:
    <<: *app
    command: ["node", "src/outbox-publisher/worker.js"]
    deploy: { replicas: 2 } # one leader, one hot standby

  delivery-worker:
    <<: *app
    command: ["node", "src/delivery-worker/worker.js"]
    deploy: { replicas: 2 }

  notification-worker:
    <<: *app
    command: ["node", "src/notification-worker/worker.js"]
